<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="description" content="Controle Financeiro Familiar - Gerenciador de finanças pessoais e familiares">
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finanças">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#4CAF50">
    <meta name="msapplication-config" content="browserconfig.xml">
    
    <title>Controle Financeiro Familiar</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Seu CSS customizado -->
    <link rel="stylesheet" href="style.css">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Ícones PWA -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512x512.png">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
</head>
<body>
    <!-- TELA PRINCIPAL DO APP -->
    <div id="app-container">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1">💰 Finanças Familiares</span>
                <div class="ms-auto d-flex align-items-center gap-3">
                    <div id="connection-indicator" style="width: 12px; height: 12px; border-radius: 50%; background-color: #28a745;"></div>
                    <span id="connection-status-text" class="text-light" style="font-size: 0.9em;">🟢 Online</span>
                </div>
            </div>
        </nav>

        <div class="container-fluid mt-4 mb-5">
            <!-- ABAS -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="btn-group w-100 flex-wrap" role="group">
                        <button id="btn-previsao" class="btn btn-success">📊 Previsão Anual</button>
                        <button id="btn-janeiro" class="btn btn-outline-primary">Jan</button>
                        <button id="btn-fevereiro" class="btn btn-outline-primary">Fev</button>
                        <button id="btn-marco" class="btn btn-outline-primary">Mar</button>
                        <button id="btn-abril" class="btn btn-outline-primary">Abr</button>
                        <button id="btn-maio" class="btn btn-outline-primary">Mai</button>
                        <button id="btn-junho" class="btn btn-outline-primary">Jun</button>
                        <button id="btn-julho" class="btn btn-outline-primary">Jul</button>
                        <button id="btn-agosto" class="btn btn-outline-primary">Ago</button>
                        <button id="btn-setembro" class="btn btn-outline-primary">Set</button>
                        <button id="btn-outubro" class="btn btn-outline-primary">Out</button>
                        <button id="btn-novembro" class="btn btn-outline-primary">Nov</button>
                        <button id="btn-dezembro" class="btn btn-outline-primary">Dez</button>
                    </div>
                </div>
            </div>

            <!-- TÍTULO DO MÊS -->
            <div class="row mb-3">
                <div class="col-12">
                    <h3 id="current-month-title" class="text-center">Previsão Anual</h3>
                </div>
            </div>

            <!-- CONTEÚDO PREVISÃO -->
            <div id="previsao-content"></div>

            <!-- CONTEÚDO MÊS -->
            <div id="month-content" style="display: none;"></div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NJTWE3xDZZAzXmYjkjR0HwAIV5q" crossorigin="anonymous"></script>

    <!-- App JS -->
    <script src="app.js"></script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(registration => {
                        console.log('✅ Service Worker registrado:', registration.scope);
                    })
                    .catch(error => {
                        console.error('❌ Erro ao registrar Service Worker:', error);
                    });
            });
        }
    </script>
</body>
</html>
