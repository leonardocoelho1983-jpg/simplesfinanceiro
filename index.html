<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="description" content="Controle Financeiro Familiar - Gerenciador de finanças pessoais e familiares">
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finanças">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#4CAF50">
    <meta name="msapplication-config" content="browserconfig.xml">
    
    <title>Controle Financeiro Familiar</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Seu CSS customizado (para ajustes finos e cores) -->
    <link rel="stylesheet" href="style.css">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Ícones PWA -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512x512.png">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
</head>
<body>
    <header class="bg-success text-white py-3 text-center shadow-sm">
        <h1 class="mb-0">Controle Financeiro Familiar</h1>
        <nav id="main-nav" class="mt-3">
            <div class="d-flex flex-wrap justify-content-center gap-2 mb-3">
                <button id="btn-previsao" class="btn btn-light active">Previsão Anual</button>
            </div>
            <div class="month-nav d-flex flex-wrap justify-content-center gap-2 px-2">
                <button data-month="0" class="btn btn-outline-light">Jan</button>
                <button data-month="1" class="btn btn-outline-light">Fev</button>
                <button data-month="2" class="btn btn-outline-light">Mar</button>
                <button data-month="3" class="btn btn-outline-light">Abr</button>
                <button data-month="4" class="btn btn-outline-light">Mai</button>
                <button data-month="5" class="btn btn-outline-light">Jun</button>
                <button data-month="6" class="btn btn-outline-light">Jul</button>
                <button data-month="7" class="btn btn-outline-light">Ago</button>
                <button data-month="8" class="btn btn-outline-light">Set</button>
                <button data-month="9" class="btn btn-outline-light">Out</button>
                <button data-month="10" class="btn btn-outline-light">Nov</button>
                <button data-month="11" class="btn btn-outline-light">Dez</button>
            </div>
        </nav>
    </header>

    <main class="container my-4">
        <!-- PREVISÃO ANUAL -->
        <section id="previsao-anual" class="page active card p-4 shadow-sm">
            <h2 class="card-title text-success border-bottom pb-2 mb-4">Previsão Orçamentária Anual</h2>
            <p class="mb-4">Defina aqui os valores previstos para cada categoria ao longo do ano. Estes valores serão a base para o acompanhamento mensal.</p>
            <div id="previsao-content" class="row g-3">
                <!-- Conteúdo da previsão será gerado via JS -->
            </div>

            <!-- Botões de ação -->
            <div class="previsao-actions d-grid gap-2 mt-4">
                <button id="save-previsao" class="btn btn-success btn-lg">Salvar Previsão</button>
                <button id="clear-previsao" class="btn btn-danger btn-lg">Limpar Previsão</button>
            </div>
        </section>

        <!-- ACOMPANHAMENTO MENSAL -->
        <section id="acompanhamento-mensal" class="page card p-4 shadow-sm">
            <h2 id="current-month-title" class="card-title text-success border-bottom pb-2 mb-4">Acompanhamento Mensal - Janeiro</h2>
            <div id="month-content" class="row g-3">
                <!-- Conteúdo do mês será gerado via JS -->
            </div>
            <button id="save-month-data" class="btn btn-success btn-lg mt-4">Salvar Dados do Mês</button>
        </section>
    </main>

    <footer class="bg-light text-center py-3 mt-4 text-muted">
        <p class="mb-0">&copy; 2026 Controle Financeiro Familiar</p>
    </footer>

    <!-- Bootstrap 5 JS (opcional, mas bom para alguns componentes futuros) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
