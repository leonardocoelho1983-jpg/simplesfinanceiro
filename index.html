<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="description" content="Controle Financeiro Familiar">
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finanças">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Controle Financeiro Familiar</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- CSS customizado -->
    <link rel="stylesheet" href="style.css">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512x512.png">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">💰 Finanças Familiares</span>
            <span id="connection-status" class="badge bg-success">🟢 Online</span>
        </div>
    </nav>

    <!-- CONTAINER PRINCIPAL -->
    <div class="container-fluid mt-4 mb-5">
        <!-- BOTÕES DE NAVEGAÇÃO -->
        <div class="row mb-3">
            <div class="col-12">
                <div class="btn-group w-100 flex-wrap" role="group">
                    <button id="btn-previsao" type="button" class="btn btn-success">📊 Previsão Anual</button>
                    <button id="btn-janeiro" type="button" class="btn btn-outline-primary">Jan</button>
                    <button id="btn-fevereiro" type="button" class="btn btn-outline-primary">Fev</button>
                    <button id="btn-marco" type="button" class="btn btn-outline-primary">Mar</button>
                    <button id="btn-abril" type="button" class="btn btn-outline-primary">Abr</button>
                    <button id="btn-maio" type="button" class="btn btn-outline-primary">Mai</button>
                    <button id="btn-junho" type="button" class="btn btn-outline-primary">Jun</button>
                    <button id="btn-julho" type="button" class="btn btn-outline-primary">Jul</button>
                    <button id="btn-agosto" type="button" class="btn btn-outline-primary">Ago</button>
                    <button id="btn-setembro" type="button" class="btn btn-outline-primary">Set</button>
                    <button id="btn-outubro" type="button" class="btn btn-outline-primary">Out</button>
                    <button id="btn-novembro" type="button" class="btn btn-outline-primary">Nov</button>
                    <button id="btn-dezembro" type="button" class="btn btn-outline-primary">Dez</button>
                </div>
            </div>
        </div>

        <!-- CONTEÚDO DINÂMICO -->
        <div id="previsao-content"></div>
        <div id="month-content" class="row"></div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NJTAE3xDZZfdNZ1ebck7QSYvF9" crossorigin="anonymous"></script>

    <!-- App JS -->
    <script src="app.js"></script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('✅ Service Worker registrado'))
                    .catch(err => console.log('❌ Erro ao registrar SW:', err));
            });
        }
    </script>
</body>
</html>
