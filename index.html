<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="description" content="Controle Financeiro Familiar - Gerenciador de finanças pessoais e familiares">
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finanças">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#4CAF50">
    <meta name="msapplication-config" content="browserconfig.xml">
    
    <title>Controle Financeiro Familiar</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Seu CSS customizado -->
    <link rel="stylesheet" href="style.css">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Ícones PWA -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512x512.png">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
</head>
<body>
    <!-- TELA DE LOGIN -->
    <div id="login-container" class="container-fluid d-flex justify-content-center align-items-center" style="min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div class="card shadow-lg" style="width: 100%; max-width: 400px;">
            <div class="card-body p-5 text-center">
                <h2 class="mb-4">💰 Finanças Familiares</h2>
                <p class="text-muted mb-4">Controle suas despesas com facilidade</p>
                
                <div id="auth-buttons" class="d-grid gap-2">
                    <button id="google-login-btn" class="btn btn-outline-primary btn-lg mb-2">
                        🔐 Entrar com Google
                    </button>
                    <button id="email-login-btn" class="btn btn-outline-secondary btn-lg">
                        📧 Entrar com Email
                    </button>
                </div>

                <div id="email-login-form" style="display: none;" class="mt-4">
                    <input type="email" id="email-input" class="form-control mb-2" placeholder="Seu email">
                    <input type="password" id="password-input" class="form-control mb-2" placeholder="Sua senha">
                    <button id="email-submit-btn" class="btn btn-primary w-100 mb-2">Entrar</button>
                    <button id="email-signup-btn" class="btn btn-success w-100 mb-2">Criar Conta</button>
                    <button id="email-cancel-btn" class="btn btn-secondary w-100">Cancelar</button>
                </div>

                <div id="loading-spinner" style="display: none;" class="text-center mt-4">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Carregando...</span>
                    </div>
                </div>

                <div id="error-message" style="display: none;" class="alert alert-danger mt-3"></div>
            </div>
        </div>
    </div>

    <!-- TELA PRINCIPAL DO APP -->
    <div id="app-container" style="display: none;">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1">💰 Finanças Familiares</span>
                <div class="ms-auto">
                    <span id="user-email" class="text-light me-3"></span>
                    <button id="logout-btn" class="btn btn-outline-danger btn-sm">Sair</button>
                </div>
            </div>
        </nav>

        <div class="container-fluid mt-4 mb-5">
            <!-- ABAS -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="btn-group w-100" role="group">
                        <button id="btn-previsao" class="btn btn-success">📊 Previsão Anual</button>
                        <button id="btn-janeiro" class="btn btn-outline-primary">Jan</button>
                        <button id="btn-fevereiro" class="btn btn-outline-primary">Fev</button>
                        <button id="btn-marco" class="btn btn-outline-primary">Mar</button>
                        <button id="btn-abril" class="btn btn-outline-primary">Abr</button>
                        <button id="btn-maio" class="btn btn-outline-primary">Mai</button>
                        <button id="btn-junho" class="btn btn-outline-primary">Jun</button>
                        <button id="btn-julho" class="btn btn-outline-primary">Jul</button>
                        <button id="btn-agosto" class="btn btn-outline-primary">Ago</button>
                        <button id="btn-setembro" class="btn btn-outline-primary">Set</button>
                        <button id="btn-outubro" class="btn btn-outline-primary">Out</button>
                        <button id="btn-novembro" class="btn btn-outline-primary">Nov</button>
                        <button id="btn-dezembro" class="btn btn-outline-primary">Dez</button>
                    </div>
                </div>
            </div>

            <!-- TÍTULO DO MÊS -->
            <h2 id="current-month-title" class="mb-4">📊 Previsão Anual</h2>

            <!-- CONTEÚDO PREVISÃO -->
            <div id="previsao-content"></div>

            <!-- CONTEÚDO MÊS -->
            <div id="month-content" style="display: none;"></div>

            <!-- SINCRONIZAÇÃO STATUS -->
            <div id="sync-status" style="display: none;" class="alert alert-info mt-4">
                <small id="sync-message"></small>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NJTPE7EpD3U1V2nKp+q1Xf7fVZi" crossorigin="anonymous"></script>

    <!-- Firebase SDK - ORDEM IMPORTANTE! -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics.js"></script>

    <!-- Configuração Firebase - ANTES do app.js -->
    <script src="firebase-config.js"></script>

    <!-- Seu app.js - DEPOIS da configuração -->
    <script src="app.js"></script>

    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('✅ Service Worker registrado'))
                .catch(err => console.log('❌ Service Worker erro:', err));
        }
    </script>
</body>
</html>
